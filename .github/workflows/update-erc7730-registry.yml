name: Update the ERC-7730 registry

# The wallet describes transactions and messages with the ERC-7730 ("clear signing") descriptors it
# ships with, and never fetches them (see `src/consts/erc7730/index.ts`). New descriptors are
# added to https://github.com/ethereum/clear-signing-erc7730-registry every week, so this
# regenerates `src/consts/erc7730/registry.json` from it every Monday and opens a PR when it
# changed, or updates the PR that is already open. The script keeps the file as it is when nothing
# was added, removed or changed, and fails instead of saving a registry from which too many
# contracts disappeared (likely a restructured or partially published registry). Run it by hand
# with "Allow many removals" to save a registry from which many contracts really were removed.
#
# Two jobs, so that the dependencies installed to test the registry never run in a job that can
# write to the repository: `generate` only reads, `pull-request` installs nothing.
#
# A PR opened with the workflow's token doesn't start other workflows, so the unit tests of the
# registry run here before the PR is opened. Requires "Allow GitHub Actions to create and approve
# pull requests" in the repository's Actions settings.
#
# The commit is made through GitHub's API rather than `git commit`, so that GitHub signs it:
# the base branch only accepts signed commits.

on:
  schedule:
    # Every Monday at 07:00 UTC
    - cron: '0 7 * * 1'
  workflow_dispatch:
    inputs:
      allow_many_removals:
        description: 'Allow many removals (many contracts really were removed from the registry)'
        type: boolean
        default: false

permissions: {}

concurrency:
  group: ${{ github.workflow }}

env:
  BASE_BRANCH: v2
  PR_BRANCH: automation/update-erc7730-registry
  REGISTRY_PATH: src/consts/erc7730/registry.json
  ARTIFACT_NAME: erc7730-registry

jobs:
  generate:
    name: Generate the registry
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      base_sha: ${{ steps.changes.outputs.base_sha }}
      base_registry_sha: ${{ steps.changes.outputs.base_registry_sha }}
      changed: ${{ steps.changes.outputs.changed }}
    steps:
      - name: Checkout code 🛎️
        uses: actions/checkout@v6
        with:
          ref: ${{ env.BASE_BRANCH }}
          persist-credentials: false

      - name: Install Node.js ⚙️
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'

      - name: Update the registry 🔄
        # Before the dependencies are installed: the script uses only Node.js and git
        env:
          ERC7730_REGISTRY_SUMMARY_PATH: ${{ runner.temp }}/erc7730-registry/summary.md
          ERC7730_REGISTRY_ALLOW_MANY_REMOVALS: ${{ inputs.allow_many_removals && 'true' || '' }}
        run: |
          mkdir -p "$RUNNER_TEMP/erc7730-registry"
          npm run humanizer:update:erc7730Registry

      - name: Check for changes 🔍
        id: changes
        run: |
          echo "base_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          # The blob sha of the file on the base branch, which the contents API needs to replace
          # it. Read here, as that API doesn't return it for files over 1 MB
          echo "base_registry_sha=$(git rev-parse --verify --quiet "HEAD:$REGISTRY_PATH" || true)" >> "$GITHUB_OUTPUT"
          if git diff --quiet -- "$REGISTRY_PATH"; then
            echo "The registry hasn't changed"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install NPM packages ♾️🕳️
        if: steps.changes.outputs.changed == 'true'
        run: npm ci

      - name: Test the registry 🧑‍🔬
        if: steps.changes.outputs.changed == 'true'
        run: |
          results_path="$RUNNER_TEMP/erc7730-registry-tests.json"
          npx jest --forceExit src/consts/erc7730/bundledRegistry.test.ts \
            -t "bundled ERC-7730 registry" --json --outputFile="$results_path"
          # Jest passes when the filter matches no test, e.g. after the tests are renamed
          jq -e '.numPassedTests > 0 and .numFailedTests == 0' "$results_path" > /dev/null || {
            echo "No test of the registry ran. Update the filter of this step to the tests' new name" >&2
            exit 1
          }

      - name: Prepare the upload 🗂️
        if: steps.changes.outputs.changed == 'true'
        run: cp "$REGISTRY_PATH" "$RUNNER_TEMP/erc7730-registry/registry.json"

      - name: Upload the registry 📦
        if: steps.changes.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          # A single directory, so that the files are at the root of the artifact
          path: ${{ runner.temp }}/erc7730-registry
          if-no-files-found: error
          retention-days: 7

  pull-request:
    name: Open, update or close the PR
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Close the outdated PR 🧹
        # The registry on the base branch is already up to date (e.g. it was updated by hand), so
        # an open PR from an earlier run would only revert newer changes
        if: needs.generate.outputs.changed == 'false'
        run: |
          open_pr_number=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$PR_BRANCH" --base "$BASE_BRANCH" --state open --json number --jq '.[].number' | head -n 1)
          if [ -n "$open_pr_number" ]; then
            gh pr close "$open_pr_number" --repo "$GITHUB_REPOSITORY" --delete-branch \
              --comment "The ERC-7730 registry on $BASE_BRANCH is already up to date."
          fi

      - name: Download the registry 📦
        if: needs.generate.outputs.changed == 'true'
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ runner.temp }}/erc7730-registry

      - name: Open or update the PR 📬
        if: needs.generate.outputs.changed == 'true'
        env:
          BASE_SHA: ${{ needs.generate.outputs.base_sha }}
          BASE_REGISTRY_SHA: ${{ needs.generate.outputs.base_registry_sha }}
        run: |
          registry_file="$RUNNER_TEMP/erc7730-registry/registry.json"
          summary_file="$RUNNER_TEMP/erc7730-registry/summary.md"

          # The branch is recreated from the commit the registry was generated from on every run,
          # so it only ever holds the commit below
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$PR_BRANCH" --silent 2> /dev/null; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/heads/$PR_BRANCH" \
              -f sha="$BASE_SHA" -F force=true --silent
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/heads/$PR_BRANCH" -f sha="$BASE_SHA" --silent
          fi

          # Committed through the API, so that GitHub signs the commit. The file is passed as a
          # JSON file, as its base64 is longer than the limit of a single command-line argument
          content_path="$RUNNER_TEMP/erc7730-registry.base64"
          request_path="$RUNNER_TEMP/erc7730-registry-commit.json"
          base64 -w 0 "$registry_file" > "$content_path"
          jq -n --rawfile content "$content_path" \
            --arg sha "$BASE_REGISTRY_SHA" \
            --arg branch "$PR_BRANCH" \
            '{message: "update: the ERC-7730 registry", content: $content, branch: $branch} + (if $sha == "" then {} else {sha: $sha} end)' \
            > "$request_path"
          gh api -X PUT "repos/$GITHUB_REPOSITORY/contents/$REGISTRY_PATH" --input "$request_path" --silent

          open_pr_number=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$PR_BRANCH" --base "$BASE_BRANCH" --state open --json number --jq '.[].number' | head -n 1)
          if [ -n "$open_pr_number" ]; then
            gh pr edit "$open_pr_number" --repo "$GITHUB_REPOSITORY" --body-file "$summary_file"
          else
            gh pr create --repo "$GITHUB_REPOSITORY" --base "$BASE_BRANCH" --head "$PR_BRANCH" \
              --title "Update: the ERC-7730 registry" \
              --body-file "$summary_file"
          fi
